name: Package

# 打出可載入的 Chrome 安裝包。手動執行會把 zip 放進 Actions artifact。
# 推上 v* tag 時，同一包也會掛到 GitHub Release。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

# Release 要寫 contents。工作不能要求比這裡更高的權限，否則整份 workflow 會在啟動前失敗。
permissions:
  contents: write

jobs:
  package:
    name: test and zip
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are required."
            echo "Use the same values as realrec NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          umask 077
          printf 'VITE_REALREC_ORIGIN=https://realrec.app\nVITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$VITE_SUPABASE_URL" \
            "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env

      - name: Test
        run: pnpm test

      - name: Zip
        run: pnpm zip

      - name: Upload zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realrec-chrome-extension-${{ github.run_number }}
          path: .output/*-chrome.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_path=$(echo .output/*-chrome.zip)
          gh release create "$GITHUB_REF_NAME" "$zip_path" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
解壓後，Chrome 打開 chrome://extensions，開啟開發人員模式，選「載入未封裝項目」，指向解壓出來、裡面有 manifest.json 的資料夾。

登入還需要 Supabase Auth 的 Redirect URLs 有 https://copmpdbhhapmohppfjofhknebekhbghi.chromiumapp.org/
EOF
)"
